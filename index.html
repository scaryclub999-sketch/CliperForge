
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipForge AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090d;color:white;font-family:Arial}
header{padding:20px;border-bottom:1px solid #292933;color:#a78bfa;font-size:24px;font-weight:bold}
main{max-width:850px;margin:auto;padding:18px}
.panel{background:#17171f;border:1px solid #333340;border-radius:14px;padding:17px;margin:16px 0}
h1{font-size:27px}
p{color:#aaa}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#252530;color:white;border:1px solid #444;border-radius:8px}
button{background:#8055ed;color:white;border:0;border-radius:9px;padding:13px;margin:5px 3px;font-weight:bold}
button:disabled{opacity:.5}
video{width:100%;background:black;border-radius:10px;margin-top:10px}
#preview{background:black;padding:12px;text-align:center;font-size:20px;font-weight:bold;white-space:pre-wrap}
#status{color:#c4a7ff}
</style>
</head>
<body>
<header>✂ ClipForge AI</header>
<main>
<h1>Make Shorts from Long Videos</h1>
<p>Your video clipping studio.</p>

<div class="panel">
<h3>1. Upload video</h3>
<input type="file" id="file" accept="video/*">
<video id="video" controls playsinline></video>
</div>

<div class="panel">
<h3>2. Select clip duration</h3>
<label>Start time (seconds)</label>
<input id="start" type="number" value="0" min="0">
<label>End time (seconds)</label>
<input id="end" type="number" value="30" min="1">
<button onclick="playClip()">Preview clip</button>
<button id="export" onclick="exportClip()">Download video clip</button>
<p id="status">Upload a video to begin.</p>
</div>

<div class="panel">
<h3>3. Multilingual captions</h3>
<select id="language">
<option>English</option>
<option>Hindi</option>
<option>Urdu</option>
<option>Hinglish</option>
<option>Roman Urdu</option>
<option>Arabic</option>
<option>Spanish</option>
</select>
<textarea id="caption" rows="3" placeholder="Write your captions here..."></textarea>
<div id="preview">Caption preview</div>
</div>

<div class="panel">
<h3>4. Export captions</h3>
<button onclick="saveCaption()">Download captions TXT</button>
<p>Automatic AI transcription and translation will be added in a later stage.</p>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
let recording=false;

$("file").onchange=()=>{
 const f=$("file").files[0];
 if(!f)return;
 $("video").src=URL.createObjectURL(f);
 $("video").load();
 $("status").textContent="Video loaded!";
};

$("caption").oninput=()=>{
 $("preview").textContent=$("caption").value||"Caption preview";
};

function times(){
 const v=$("video");
 const s=Number($("start").value);
 const e=Number($("end").value);
 if(!v.src||!Number.isFinite(v.duration)){
  throw Error("Upload a video first.");
 }
 if(s<0||e<=s||e>v.duration){
  throw Error("Choose valid start and end times.");
 }
 return {v,s,e};
}

async function playClip(){
 try{
  const {v,s}=times();
  v.currentTime=s;
  await v.play();
  const stop=()=>{
   if(v.currentTime>=Number($("end").value)){
    v.pause();v.removeEventListener("timeupdate",stop);
   }
  };
  v.addEventListener("timeupdate",stop);
 }catch(err){alert(err.message)}
}

async function exportClip(){
 if(recording)return;
 let recorder,stream,timer;
 const btn=$("export");
 try{
  const {v,s,e}=times();
  if(!v.captureStream||!window.MediaRecorder){
   throw Error("Your browser does not support video recording.");
  }
  recording=true;btn.disabled=true;
  $("status").textContent="Preparing clip...";
  v.pause();
  v.currentTime=s;
  await new Promise(resolve=>{
   v.addEventListener("seeked",resolve,{once:true});
  });
  stream=v.captureStream();
  const mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime)throw Error("WebM recording is not supported.");
  const chunks=[];
  recorder=new MediaRecorder(stream,{mimeType:mime});
  recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data)};
  const finished=new Promise((resolve,reject)=>{
   recorder.onstop=resolve;
   recorder.onerror=()=>reject(Error("Recording failed."));
  });
  recorder.start();
  await v.play();
  $("status").textContent="Recording clip... Keep this page open.";
  timer=setInterval(()=>{
   if(v.currentTime>=e){
    clearInterval(timer);v.pause();recorder.stop();
   }
  },100);
  await finished;
  const blob=new Blob(chunks,{type:"video/webm"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="clipforge-short.webm";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $("status").textContent="Your clip is ready!";
 }catch(err){
  clearInterval(timer);
  if(recorder&&recorder.state!=="inactive")recorder.stop();
  $("status").textContent=err.message;
 }finally{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  recording=false;btn.disabled=false;
 }
}

function saveCaption(){
 const blob=new Blob([$("caption").value],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");
 const url=URL.createObjectURL(blob);
 a.href=url;a.download="captions.txt";a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
</script>
</body>
</html>
